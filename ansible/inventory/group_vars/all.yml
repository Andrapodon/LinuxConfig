---
# ==============================================================================
# Global Defaults for Arch Linux Laptop Provisioning (LinuxConfig)
# Personal secrets / machine-specific overrides belong in gitignored:
#   ansible/inventory/group_vars/local.yml
# (Copy local.yml.example -> local.yml and optionally encrypt with ansible-vault)
# ==============================================================================

target_user: "marc"
target_user_shell: "/bin/bash"
dotfiles_dir: "/home/{{ target_user }}/LinuxConfig"
nvim_repo_url: "https://github.com/Andrapodon/config.nvim.git"

# Feature groups (all selected stacks enabled by default)
features:
  dev_science: true
  containers: true
  maker_cad: true
  creative: true
  gaming: true
  printing: true
  peripherals: true
  firewall: true
  pacman_hook: true

# Hardware & bootloader options (keep hardware-specific tweaks opt-in)
enable_grub_theme: false
grub_theme_path: "/usr/share/grub/themes/breeze/theme.txt"
grub_background_src: "{{ dotfiles_dir }}/pictures/bioshock.png"
grub_background_dest: "/efi/grub/bioshock.png"
grub_color_normal: "white/black"
grub_color_highlight: "black/light-cyan"
grub_timeout: "5"
enable_trackpoint_scroller: false
enable_tlp_custom_conf: false
enable_custom_sleep_conf: false
disable_ipv6: false
enable_backlight_udev: true

# Stow packages under LinuxConfig/stow/
stow_packages:
  - alacritty
  - antigravity-ide
  - Code
