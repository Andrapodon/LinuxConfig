---
- name: Arch Linux Laptop Provisioning
  hosts: laptop
  become: true

  pre_tasks:
    - name: Check for optional gitignored local.yml overrides
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/inventory/group_vars/local.yml"
      register: local_vars_file

    - name: Load local.yml overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/inventory/group_vars/local.yml"
      when: local_vars_file.stat.exists

    - name: Verify target user account exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"

  roles:
    - aur_support
    - packages
    - btrfs_snapper
    - dotfiles
    - laptop_system
    - seadrive
    - ssh_remote
    - wireguard_vpn
    - borgmatic_backups
