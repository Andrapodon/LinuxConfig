---
- name: Configure WireGuard VPN and WAN auto-connect dispatcher
  when: wireguard.enabled | default(false)
  block:
    - name: Install WireGuard tools and openresolv
      community.general.pacman:
        name:
          - wireguard-tools
          - openresolv
        state: present

    - name: Create /etc/wireguard directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy WireGuard interface configuration
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "/etc/wireguard/{{ wireguard.interface | default('wg0') }}.conf"
        owner: root
        group: root
        mode: '0600'

    - name: Ensure NetworkManager dispatcher directory exists
      ansible.builtin.file:
        path: /etc/NetworkManager/dispatcher.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy NetworkManager WAN auto-connect dispatcher script
      ansible.builtin.template:
        src: 99-wireguard-wan.sh.j2
        dest: /etc/NetworkManager/dispatcher.d/99-wireguard-wan.sh
        owner: root
        group: root
        mode: '0755'

    - name: Enable NetworkManager dispatcher service
      ansible.builtin.systemd:
        name: NetworkManager-dispatcher.service
        enabled: true
        state: started
