# SSH remote hardening (only disables password auth cleanly when keys are supplied)
ssh_remote:
  enabled: true
  maintainer_public_keys: []

# Home WireGuard VPN auto-connect on WAN (configure real values in local.yml)
home_wifi_ssids: []
wireguard:
  enabled: false
  interface: "wg0"
  address: ""
  dns: ""
  server_public_key: ""
  server_endpoint: ""
  allowed_ips: "0.0.0.0/0, ::/0"
  keepalive: 25
  client_private_key: ""

# SeaDrive setup
seadrive:
  mount_point: "/home/{{ target_user }}/SeaDrive"
  enable_autostart: true

# 3-2-1 Backups with Borgmatic 2.x + native Btrfs snapshots
borgmatic_policy:
  source_directories:
    - /home
    - /etc
  exclude_patterns:
    - "*/.snapshots/*"
    - "/home/*/.cache"
    - "/home/*/.seadrive/data"
    - "/home/*/.local/share/Trash"
    - "/home/*/.local/share/Steam"
    - "/home/*/.mozilla/firefox/*/storage/default/*/cache*"
  archive_name_format: "{hostname}-{now}"
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6

# Target credentials/endpoints (override all keys cleanly in local.yml)
borgmatic_targets:
  ssh_key_path: "/root/.ssh/id_ed25519"
  encryption_passphrase: ""
  homelab_enabled: false
  homelab_repo: ""
  hetzner_enabled: false
  hetzner_repo: ""
